<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, #1f2733 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 40px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 2px;
    margin: 0 0 14px;
  }
  h1 .sub { font-size: 13px; color: var(--muted); letter-spacing: 1px; font-weight: 400; display: block; text-align: center; margin-top: 4px; }
  .hud {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 12px;
  }
  .hud .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 14px;
    color: var(--muted);
  }
  .hud .stat b { color: var(--accent); font-size: 16px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  #game {
    background: #000;
    border: 2px solid var(--border);
    border-radius: 6px;
    width: 100%;
    max-width: 520px;
    height: auto;
    image-rendering: pixelated;
    display: block;
  }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .settings {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .settings label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .settings select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #21262d; border-color: #8b949e; }
  button:active { transform: translateY(1px); }
  .help { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; line-height: 1.8; }
  .help b { color: var(--text); }
  .legend { margin-top: 6px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7; }
  .dpad {
    margin-top: 16px;
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  .dpad button { width: 56px; height: 56px; font-size: 22px; padding: 0; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .fire { grid-column: 2; grid-row: 2; background: #5a1e1e; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) {
    .dpad { display: grid; }
  }
</style>
</head>
<body>
  <h1>坦克大战 <span class="sub">TANK BATTLE</span></h1>

  <div class="hud">
    <div class="stat">得分 <b id="score">0</b></div>
    <div class="stat">生命 <b id="lives">3</b></div>
    <div class="stat" id="lives2wrap" style="display:none">生命2 <b id="lives2">3</b></div>
    <div class="stat">关卡 <b id="level">1</b></div>
    <div class="stat">敌人 <b id="enemies">0</b></div>
  </div>

  <canvas id="game" width="520" height="520"></canvas>

  <div class="controls">
    <button id="startBtn">开始 / 重新开始</button>
    <button id="pauseBtn">暂停</button>
    <button id="muteBtn">音效：开</button>
  </div>

  <div class="settings">
    <label>模式
      <select id="modeSel">
        <option value="single">单人</option>
        <option value="two">双人</option>
      </select>
    </label>
    <label>难度
      <select id="diffSel">
        <option value="easy">简单</option>
        <option value="normal" selected>普通</option>
        <option value="hard">困难</option>
        <option value="hell">地狱</option>
      </select>
    </label>
  </div>

  <div class="dpad" id="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="fire" id="fireBtn">🔥</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>

  <p class="help">
    单人：<b>方向键</b>移动 · <b>空格/J</b>射击<br>
    双人：P1 <b>方向键+空格/J</b> · P2 <b>WASD+F</b><br>
    暂停：<b>Esc/P</b>
  </p>
  <p class="legend">
    道具：<span style="color:#ff5c5c">火=火力</span> <span style="color:#4dd2ff">盾=护盾</span> <span style="color:#7cff6b">命=加命</span>
    <span style="color:#ffd166">速=加速</span> <span style="color:#ff9f43">弹=炸弹</span> <span style="color:#a29bfe">冻=冻结</span>
  </p>

<script>
'use strict';

// ---------- 常量 ----------
const TILE = 40, COLS = 13, ROWS = 13;
const TANK = 34, BULLET = 6;
const TANK_SPEED = 2.2, BULLET_SPEED = 6;
const OFF = (TILE - TANK) / 2;
const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

// 地图：13×13。'#'=砖墙 '@'=钢墙 '~'=水 '%'=树丛 'B'=基地 '.'=空地
const MAPS = [
  [
    ".............",
    "###.#.#.#.###",
    "#...#...#...#",
    "@...#.#.#...@",
    "#.#####.###.#",
    "#.#.......#.#",
    ".....###.....",
    "#.#.......#.#",
    "#.#####.###.#",
    "@...#.#.#...@",
    "#...#...#...#",
    "###.#.#.#.###",
    "......B......",
  ],
  [
    ".............",
    "###~#~#~#~###",
    "#...#...#...#",
    "@..%.%.%....@",
    "#~###~###~#.#",
    "#.#...%...#.#",
    ".....###.....",
    "#.#...%...#.#",
    "#~###~###~#.#",
    "@..%.%.%....@",
    "#...#...#...#",
    "###~#~#~#~###",
    "......B......",
  ],
  [
    ".............",
    "@#@#~#~#@#@#@",
    "#.#.#.#.#.#.#",
    "@..%.%.%....@",
    "#~###@###~#.#",
    "#.#.......#.#",
    "..%.###.###.%",
    "#.#.......#.#",
    "#~###@###~#.#",
    "@..%.%.%....@",
    "#.#.#.#.#.#.#",
    "@#@#~#~#@#@#@",
    "......B......",
  ],
];

const SPAWNS = [{ x: 0, y: 0 }, { x: 6, y: 0 }, { x: 12, y: 0 }];

const P1 = { spawn: { x: 4, y: 12 }, color: '#4c9a2a', track: '#2f6b1c',
  bind: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', fire: ['Space', 'KeyJ'] } };
const P2 = { spawn: { x: 8, y: 12 }, color: '#d8b13c', track: '#8a6f1c',
  bind: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', fire: ['KeyF', 'KeyG'] } };

const DIFFICULTIES = {
  easy:   { label: '简单', enemySpeed: 0.9, fireMin: 1.9, fireMax: 3.1, aimChance: 0.25, extra: 0 },
  normal: { label: '普通', enemySpeed: 1.0, fireMin: 1.0, fireMax: 1.9, aimChance: 0.55, extra: 0 },
  hard:   { label: '困难', enemySpeed: 1.3, fireMin: 0.7, fireMax: 1.4, aimChance: 0.8,  extra: 4 },
  hell:   { label: '地狱', enemySpeed: 1.6, fireMin: 0.5, fireMax: 1.0, aimChance: 0.95, extra: 8 },
};

const POWERUPS = {
  P: { name: '火力', char: '火', color: '#ff5c5c' },
  S: { name: '护盾', char: '盾', color: '#4dd2ff' },
  L: { name: '加命', char: '命', color: '#7cff6b' },
  F: { name: '加速', char: '速', color: '#ffd166' },
  B: { name: '炸弹', char: '弹', color: '#ff9f43' },
  T: { name: '冻结', char: '冻', color: '#a29bfe' },
};

// ---------- 状态 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let grid, bullets, enemies, explosions, powerups;
let players;
let level;
let score, levelNum;
let mode = 0, diff = DIFFICULTIES.normal;   // mode: 0=单人 1=双人
let state;              // 'menu' | 'playing' | 'paused' | 'clear' | 'gameover'
let message, clearTimer;
let freezeTimer, powerupTimer;
let keys = {};

// ---------- 工具 ----------
function rect(t) { return { x: t.x, y: t.y, w: TANK, h: TANK }; }
function brect(b) { return { x: b.x, y: b.y, w: b.size, h: b.size }; }
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function isSolid(c) { return c === '#' || c === '@' || c === '~' || c === 'B'; }

function gridCollides(t) {
  const x0 = Math.floor(t.x / TILE);
  const y0 = Math.floor(t.y / TILE);
  const x1 = Math.floor((t.x + TANK - 0.01) / TILE);
  const y1 = Math.floor((t.y + TANK - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return true;
      if (isSolid(grid[ty][tx])) return true;
    }
  }
  return false;
}

function tankCollides(t) {
  if (gridCollides(t)) return true;
  for (const p of players) {
    if (p.active && p.alive && p !== t && overlap(rect(t), rect(p))) return true;
  }
  for (const e of enemies) {
    if (e.alive && e !== t && overlap(rect(t), rect(e))) return true;
  }
  return false;
}

function snapToLane(t, vertical) {
  if (vertical) t.x = Math.round((t.x - OFF) / TILE) * TILE + OFF;
  else t.y = Math.round((t.y - OFF) / TILE) * TILE + OFF;
}

function setDir(t, dir) {
  t.dir = dir;
  snapToLane(t, dir === UP || dir === DOWN);
}

function speedOf(t) {
  if (t.isPlayer) return TANK_SPEED * (t.speedBoost > 0 ? 1.6 : 1);
  return TANK_SPEED * diff.enemySpeed;
}

function moveTank(t) {
  const sp = speedOf(t);
  t.x += DX[t.dir] * sp;
  t.y += DY[t.dir] * sp;
  if (tankCollides(t)) {
    t.x -= DX[t.dir] * sp;
    t.y -= DY[t.dir] * sp;
    snapToLane(t, t.dir === UP || t.dir === DOWN);
    return false;
  }
  return true;
}

// ---------- 子弹 ----------
function shoot(t) {
  const mine = bullets.filter(b => !b.dead && b.owner === t);
  const max = t.isPlayer ? 2 : 1;
  if (mine.length >= max) return;
  const size = (t.isPlayer && t.power > 0) ? 10 : BULLET;
  const cx = t.x + TANK / 2, cy = t.y + TANK / 2;
  const reach = TANK / 2 + size / 2 + 1;
  bullets.push({
    x: cx - size / 2 + DX[t.dir] * reach,
    y: cy - size / 2 + DY[t.dir] * reach,
    dir: t.dir, owner: t, dead: false, size: size,
    pierce: (t.isPlayer && t.power > 0)
  });
  playSfx('shoot');
}

function bulletHitsWall(b) {
  const cx = b.x + b.size / 2, cy = b.y + b.size / 2;
  const tx = Math.floor(cx / TILE), ty = Math.floor(cy / TILE);
  if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return false;
  const c = grid[ty][tx];
  if (c === '#') {
    grid[ty][tx] = '.';
    spawnExplosion(cx, cy, 0.4);
    playSfx('hit');
    if (!b.pierce) b.dead = true;
    return true;
  }
  if (c === '@') {
    if (b.pierce) {
      grid[ty][tx] = '.';
      spawnExplosion(cx, cy, 0.4);
      playSfx('hit');
    } else {
      b.dead = true;
      spawnExplosion(cx, cy, 0.3);
      playSfx('hit');
    }
    return true;
  }
  if (c === 'B') {
    grid[ty][tx] = 'X';
    b.dead = true;
    destroyBase();
    return true;
  }
  return false; // '~' 和 '%' 和 '.' 都穿过
}

function bulletHitsTank(b) {
  if (b.owner.isPlayer) {
    for (const e of enemies) {
      if (e.alive && overlap(brect(b), rect(e))) { killEnemy(e); b.dead = true; return true; }
    }
  } else {
    for (const p of players) {
      if (p.active && p.alive && overlap(brect(b), rect(p))) {
        b.dead = true;
        if (p.invuln <= 0) killPlayer(p);
        return true;
      }
    }
  }
  return false;
}

function moveBullet(b) {
  for (let s = 0; s < BULLET_SPEED; s++) {
    b.x += DX[b.dir];
    b.y += DY[b.dir];
    if (b.x < -8 || b.x > W + 8 || b.y < -8 || b.y > H + 8) { b.dead = true; return; }
    if (bulletHitsWall(b)) return;
    if (bulletHitsTank(b)) return;
  }
}

// ---------- 击杀 / 基地 ----------
function killEnemy(e) {
  e.alive = false;
  score += 100;
  level.killed++;
  spawnExplosion(e.x + TANK / 2, e.y + TANK / 2, 1);
  playSfx('explode');
  updateHud();
}

function killPlayer(p) {
  p.alive = false;
  p.lives--;
  spawnExplosion(p.x + TANK / 2, p.y + TANK / 2, 1);
  playSfx('explode');
  if (p.lives > 0) p.respawnTimer = 1.4;
  else p.out = true;
  updateHud();
}

function destroyBase() {
  spawnExplosion(6 * TILE + TILE / 2, 12 * TILE + TILE / 2, 1.4);
  playSfx('explode');
  state = 'gameover';
  message = '基地被摧毁';
}

// ---------- 玩家 ----------
function makePlayer(cfg) {
  return {
    x: cfg.spawn.x * TILE + OFF, y: cfg.spawn.y * TILE + OFF,
    dir: UP, alive: true, active: true, invuln: 2, isPlayer: true,
    lives: 3, out: false, respawnTimer: 0,
    power: 0, speedBoost: 0,
    color: cfg.color, track: cfg.track, bind: cfg.bind
  };
}

function respawnPlayer(p) {
  p.x = p.spawnX; p.y = p.spawnY;
  p.dir = UP; p.alive = true; p.invuln = 2;
}

// ---------- 敌人 AI ----------
function nearestPlayer(e) {
  let best = null, bd = Infinity;
  for (const p of players) {
    if (!p.active || !p.alive) continue;
    const d = (p.x - e.x) * (p.x - e.x) + (p.y - e.y) * (p.y - e.y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function pickDir(e) {
  if (Math.random() < diff.aimChance) {
    const t = nearestPlayer(e);
    if (t) {
      const dx = t.x - e.x, dy = t.y - e.y;
      const d = (Math.abs(dx) > Math.abs(dy)) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
      setDir(e, d);
      return;
    }
  }
  setDir(e, Math.floor(Math.random() * 4));
}

function spawnEnemy() {
  for (const p of SPAWNS) {
    const cand = { x: p.x * TILE + OFF, y: p.y * TILE + OFF, dir: DOWN, alive: true, dead: false,
      moveTimer: 0.5, shootTimer: diff.fireMin + Math.random() * (diff.fireMax - diff.fireMin) };
    if (gridCollides(cand)) continue;
    let blocked = false;
    for (const pl of players) if (pl.active && pl.alive && overlap(rect(cand), rect(pl))) blocked = true;
    for (const e of enemies) if (e.alive && overlap(rect(cand), rect(e))) blocked = true;
    if (blocked) continue;
    enemies.push(cand);
    level.spawned++;
    return;
  }
}

// ---------- 道具 ----------
function spawnPowerup() {
  if (powerups.length >= 3) return;
  const types = Object.keys(POWERUPS);
  for (let i = 0; i < 40; i++) {
    const tx = Math.floor(Math.random() * COLS);
    const ty = 1 + Math.floor(Math.random() * (ROWS - 2));
    if (grid[ty][tx] !== '.') continue;
    const r = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
    let occupied = false;
    for (const p of players) if (p.active && p.alive && overlap(rect(p), r)) occupied = true;
    for (const e of enemies) if (e.alive && overlap(rect(e), r)) occupied = true;
    if (occupied) continue;
    powerups.push({ tx: tx, ty: ty, type: types[Math.floor(Math.random() * types.length)], life: 12 });
    return;
  }
}

function applyPowerup(p, type) {
  switch (type) {
    case 'P': p.power = 10; break;                            // 火力：子弹打穿钢墙
    case 'S': p.invuln = Math.max(p.invuln, 8); break;        // 护盾：8 秒无敌
    case 'L': p.lives++; break;                               // 加命
    case 'F': p.speedBoost = 10; break;                       // 加速：10 秒
    case 'B':                                                  // 炸弹：消灭所有敌人
      for (const e of enemies) if (e.alive) killEnemy(e);
      break;
    case 'T': freezeTimer = 6; break;                          // 冻结敌人 6 秒
  }
  playSfx('power');
  updateHud();
}

// ---------- 关卡 / 游戏流程 ----------
function startGame() {
  mode = document.getElementById('modeSel').value === 'two' ? 1 : 0;
  diff = DIFFICULTIES[document.getElementById('diffSel').value] || DIFFICULTIES.normal;
  score = 0;
  levelNum = 1;
  startLevel(1);
  state = 'playing';
  ensureAudio();
  updateHud();
}

function startLevel(n) {
  grid = MAPS[(n - 1) % MAPS.length].map(r => r.split(''));
  bullets = [];
  enemies = [];
  explosions = [];
  powerups = [];
  freezeTimer = 0;
  powerupTimer = 6;
  level = { num: n, enemyTotal: (8 + (n - 1) * 4) + diff.extra + (mode === 1 ? 4 : 0),
    killed: 0, spawned: 0, spawnTimer: 0.6 };
  players = [makePlayer(P1), makePlayer(P2)];
  players[1].active = (mode === 1);
  for (const p of players) { p.spawnX = p.x; p.spawnY = p.y; }
  updateHud();
}

// ---------- 更新 ----------
function update(dt) {
  if (state === 'clear') {
    clearTimer -= dt;
    if (clearTimer <= 0) { levelNum++; startLevel(levelNum); state = 'playing'; }
    return;
  }
  if (state !== 'playing') return;

  // 玩家
  for (const p of players) {
    if (!p.active) continue;
    if (p.alive) {
      if (p.invuln > 0) p.invuln -= dt;
      if (p.power > 0) p.power -= dt;
      if (p.speedBoost > 0) p.speedBoost -= dt;
      let d = null;
      if (keys[p.bind.up]) d = UP;
      else if (keys[p.bind.down]) d = DOWN;
      else if (keys[p.bind.left]) d = LEFT;
      else if (keys[p.bind.right]) d = RIGHT;
      if (d !== null) {
        if (d !== p.dir) setDir(p, d);
        moveTank(p);
      }
    } else if (!p.out) {
      p.respawnTimer -= dt;
      if (p.respawnTimer <= 0) respawnPlayer(p);
    }
  }
  if (players.every(p => !p.active || p.out)) {
    state = 'gameover';
    message = '游戏结束';
    return;
  }

  // 道具：拾取 + 刷新
  for (const p of players) {
    if (!p.active || !p.alive) continue;
    for (let i = powerups.length - 1; i >= 0; i--) {
      const pu = powerups[i];
      const r = { x: pu.tx * TILE + 6, y: pu.ty * TILE + 6, w: TILE - 12, h: TILE - 12 };
      if (overlap(rect(p), r)) { applyPowerup(p, pu.type); powerups.splice(i, 1); }
    }
  }
  for (const pu of powerups) pu.life -= dt;
  powerups = powerups.filter(pu => pu.life > 0);
  powerupTimer -= dt;
  if (powerupTimer <= 0) { spawnPowerup(); powerupTimer = 7 + Math.random() * 6; }

  // 冻结计时
  if (freezeTimer > 0) freezeTimer -= dt;

  // 生成敌人
  level.spawnTimer -= dt;
  if (level.spawnTimer <= 0 && level.spawned < level.enemyTotal && enemies.length < 3) {
    spawnEnemy();
    level.spawnTimer = 1.3;
  }

  // 敌人
  for (const e of enemies) {
    if (!e.alive) continue;
    if (freezeTimer <= 0) {
      e.moveTimer -= dt;
      e.shootTimer -= dt;
      if (e.moveTimer <= 0) { pickDir(e); e.moveTimer = 0.6 + Math.random() * 1.4; }
      if (!moveTank(e)) { pickDir(e); e.moveTimer = 0.3 + Math.random() * 0.8; }
      if (e.shootTimer <= 0) { shoot(e); e.shootTimer = diff.fireMin + Math.random() * (diff.fireMax - diff.fireMin); }
    }
  }
  enemies = enemies.filter(e => e.alive);

  // 子弹
  for (const b of bullets) { if (!b.dead) moveBullet(b); }
  bullets = bullets.filter(b => !b.dead);

  // 爆炸动画
  for (const x of explosions) x.life -= dt;
  explosions = explosions.filter(x => x.life > 0);

  // 关卡完成
  if (state === 'playing' && level.killed >= level.enemyTotal) {
    state = 'clear';
    message = '第 ' + level.num + ' 关通过！';
    clearTimer = 2;
    playSfx('power');
  }
}

// ---------- 爆炸 ----------
function spawnExplosion(x, y, size) {
  explosions.push({ x: x, y: y, r: 6, maxR: 20 + size * 8, life: 0.35, t: 0 });
}

// ---------- 音效 ----------
let actx = null, muted = false;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function playSfx(type) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    if (type === 'shoot') {
      o.type = 'square'; o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(200, t + 0.07);
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.start(t); o.stop(t + 0.09);
    } else if (type === 'hit') {
      o.type = 'triangle'; o.frequency.setValueAtTime(240, t);
      o.frequency.exponentialRampToValueAtTime(80, t + 0.1);
      g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.start(t); o.stop(t + 0.13);
    } else if (type === 'explode') {
      o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.28);
      g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.start(t); o.stop(t + 0.33);
    } else if (type === 'power') {
      o.type = 'square'; o.frequency.setValueAtTime(523, t);
      o.frequency.setValueAtTime(659, t + 0.09);
      o.frequency.setValueAtTime(784, t + 0.18);
      g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    }
  } catch (e) {}
}

// ---------- 绘制 ----------
function drawTank(t, body, track) {
  if (t.isPlayer && t.invuln > 0 && Math.floor(performance.now() / 90) % 2 === 0) return;
  const x = t.x, y = t.y, s = TANK;
  const vertical = (t.dir === UP || t.dir === DOWN);
  ctx.fillStyle = track;
  if (vertical) {
    ctx.fillRect(x + 1, y, 7, s);
    ctx.fillRect(x + s - 8, y, 7, s);
  } else {
    ctx.fillRect(x, y + 1, s, 7);
    ctx.fillRect(x, y + s - 8, s, 7);
  }
  ctx.fillStyle = body;
  ctx.fillRect(x + 7, y + 7, s - 14, s - 14);
  ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  const cx = x + s / 2, cy = y + s / 2, L = s / 2 + 2;
  if (t.dir === UP) ctx.fillRect(cx - 2, cy - L, 4, L);
  else if (t.dir === DOWN) ctx.fillRect(cx - 2, cy, 4, L);
  else if (t.dir === LEFT) ctx.fillRect(cx - L, cy - 2, L, 4);
  else ctx.fillRect(cx, cy - 2, L, 4);
}

function drawBrick(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#9c4a1a';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#7a3510';
  ctx.fillRect(x, y + TILE / 2 - 2, TILE, 4);
  ctx.fillRect(x + TILE / 2 - 2, y, 4, TILE / 2);
  ctx.fillRect(x + TILE / 4 - 2, y + TILE / 2, 4, TILE / 2);
  ctx.fillRect(x + TILE * 3 / 4 - 2, y + TILE / 2, 4, TILE / 2);
}

function drawSteel(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#8b949e';
  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = '#454b52';
  ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
  ctx.fillStyle = '#c9d1d9';
  const pts = [[10, 10], [30, 10], [10, 30], [30, 30]];
  for (const p of pts) { ctx.beginPath(); ctx.arc(x + p[0], y + p[1], 3, 0, Math.PI * 2); ctx.fill(); }
}

function drawWater(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#1657c0';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#2f7de0';
  const off = (performance.now() / 500) % TILE;
  ctx.fillRect(x, y + off, TILE, 3);
  ctx.fillRect(x, y + ((off + 20) % TILE), TILE, 3);
}

function drawTree(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#2d6a1e';
  ctx.beginPath();
  ctx.arc(x + 10, y + 14, 8, 0, Math.PI * 2);
  ctx.arc(x + 30, y + 12, 9, 0, Math.PI * 2);
  ctx.arc(x + 18, y + 28, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3a8a28';
  ctx.beginPath();
  ctx.arc(x + 14, y + 20, 7, 0, Math.PI * 2);
  ctx.arc(x + 26, y + 20, 7, 0, Math.PI * 2);
  ctx.fill();
}

function drawStar(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = (i % 2 === 0) ? r : r * 0.45;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawBase(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#f0b429';
  ctx.beginPath();
  ctx.moveTo(x + TILE / 2, y + 3);
  ctx.lineTo(x + TILE - 3, y + TILE / 2);
  ctx.lineTo(x + TILE / 2, y + TILE - 3);
  ctx.lineTo(x + 3, y + TILE / 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#c0392b';
  drawStar(x + TILE / 2, y + TILE / 2, 9);
  ctx.fill();
}

function drawGrid() {
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const c = grid[ty][tx];
      if (c === '#') drawBrick(tx, ty);
      else if (c === '@') drawSteel(tx, ty);
      else if (c === '~') drawWater(tx, ty);
      else if (c === 'B') drawBase(tx, ty);
      else if (c === 'X') { ctx.fillStyle = '#3a3a3a'; ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE); }
    }
  }
}

function drawTrees() {
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      if (grid[ty][tx] === '%') drawTree(tx, ty);
    }
  }
}

function drawBullet(b) {
  const col = b.owner.isPlayer ? (b.pierce ? '#ff9f43' : '#ffe08a') : '#ff6b6b';
  ctx.fillStyle = col;
  ctx.fillRect(b.x, b.y, b.size, b.size);
}

function drawPowerup(pu) {
  const x = pu.tx * TILE, y = pu.ty * TILE;
  const c = POWERUPS[pu.type].color;
  ctx.globalAlpha = 0.8 + 0.2 * Math.sin(performance.now() / 180);
  ctx.fillStyle = '#111';
  ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
  ctx.fillStyle = c;
  ctx.fillRect(x + 7, y + 7, TILE - 14, TILE - 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(POWERUPS[pu.type].char, x + TILE / 2, y + TILE / 2 + 1);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawExplosions() {
  for (const x of explosions) {
    const p = 1 - x.life / 0.35;
    const r = x.r + (x.maxR - x.r) * p;
    ctx.globalAlpha = Math.max(0, 1 - p);
    ctx.fillStyle = (p < 0.5) ? '#ffd166' : '#ef476f';
    ctx.beginPath(); ctx.arc(x.x, x.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawOverlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f0b429';
  ctx.font = 'bold 34px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, H / 2 - 8);
  if (sub) {
    ctx.fillStyle = '#e6edf3';
    ctx.font = '16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(sub, W / 2, H / 2 + 30);
  }
  ctx.textAlign = 'left';
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  drawGrid();
  for (const b of bullets) if (!b.dead) drawBullet(b);
  for (const p of players) if (p.active && p.alive) drawTank(p, p.color, p.track);
  const frozen = freezeTimer > 0;
  for (const e of enemies) if (e.alive) drawTank(e, frozen ? '#7fa8c9' : '#8a8f98', frozen ? '#4a6b8a' : '#5b5f66');
  drawTrees();
  for (const pu of powerups) drawPowerup(pu);
  drawExplosions();

  if (state === 'menu') drawOverlay('坦克大战', '按 开始 或 Enter 进入游戏');
  else if (state === 'paused') drawOverlay('已暂停', '按 Esc/P 或点击 暂停 继续');
  else if (state === 'clear') drawOverlay(message, '准备进入下一关…');
  else if (state === 'gameover') drawOverlay(message, '得分 ' + score + ' · 点击 开始 再来一局');
}

// ---------- HUD ----------
function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = levelNum;
  document.getElementById('enemies').textContent = level ? (level.enemyTotal - level.killed) : 0;
  if (players && players[0]) {
    document.getElementById('lives').textContent = Math.max(0, players[0].lives);
    if (players[1] && players[1].active) {
      document.getElementById('lives2wrap').style.display = '';
      document.getElementById('lives2').textContent = Math.max(0, players[1].lives);
    } else {
      document.getElementById('lives2wrap').style.display = 'none';
    }
  }
}

// ---------- 输入 ----------
function handleKey(e, down) {
  const k = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
  keys[k] = down;

  if (down) {
    if (k === 'KeyP' || k === 'Escape') { togglePause(); return; }
    if (k === 'Enter') { if (state === 'menu' || state === 'gameover' || state === 'clear') startGame(); return; }
    if (state === 'playing') {
      for (const p of players) {
        if (p.active && p.alive && p.bind.fire.includes(k)) shoot(p);
      }
    }
  }
}

function togglePause() {
  if (state === 'playing') state = 'paused';
  else if (state === 'paused') state = 'playing';
}

window.addEventListener('keydown', e => handleKey(e, true));
window.addEventListener('keyup', e => handleKey(e, false));

// 触屏方向键（控制 1P）
function bindPad() {
  const dirs = { up: UP, down: DOWN, left: LEFT, right: RIGHT };
  document.querySelectorAll('.dpad [data-dir]').forEach(btn => {
    const d = dirs[btn.dataset.dir];
    btn.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (state === 'playing' && players[0].alive) setDir(players[0], d);
    });
  });
  document.getElementById('fireBtn').addEventListener('pointerdown', ev => {
    ev.preventDefault();
    if (state === 'playing' && players[0].alive) shoot(players[0]);
  });
}

// ---------- 按钮 ----------
document.getElementById('startBtn').addEventListener('click', () => { ensureAudio(); startGame(); });
document.getElementById('pauseBtn').addEventListener('click', () => { ensureAudio(); togglePause(); });
document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '音效：关' : '音效：开';
});
canvas.addEventListener('click', () => { ensureAudio(); if (state === 'menu' || state === 'gameover') startGame(); });

// ---------- 主循环 ----------
let last = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- 初始状态 ----------
state = 'menu';
score = 0;
levelNum = 1;
level = { num: 1, enemyTotal: 0, killed: 0, spawned: 0, spawnTimer: 0 };
grid = MAPS[0].map(r => r.split(''));
players = [makePlayer(P1), makePlayer(P2)];
players[1].active = false;
for (const p of players) { p.spawnX = p.x; p.spawnY = p.y; }
bullets = [];
enemies = [];
explosions = [];
powerups = [];
freezeTimer = 0;
powerupTimer = 6;
updateHud();
bindPad();
requestAnimationFrame(loop);
</script>
</body>
